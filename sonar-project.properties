sonar.organization=gsinuiri-coder
sonar.projectKey=gsinuiri-coder_yacco
sonar.projectName=yacco

sonar.sources=apps/api/src,apps/web/src,packages/shared/src,apps/api/prisma/seed.ts
sonar.tests=apps/api/test
sonar.test.inclusions=**/*.test.ts,**/*.int.test.ts
# dist/** and prisma/migrations/** are preventive: neither currently sits
# under sonar.sources (dist/ is never nested inside a src/ root; migrations
# live in apps/api/prisma, and the only path added from that directory is
# seed.ts, listed explicitly above) so today these two exclude nothing. They
# stay so that dist output or migration SQL added to sonar.sources later is
# excluded from the first commit, not after someone notices it wasn't.
sonar.exclusions=**/dist/**,**/node_modules/**,apps/api/prisma/migrations/**,**/*.test.ts,**/*.test.tsx,apps/web/src/test/**

# Pure declarative Nest wiring (no branches, no functions of their own): if
# any of these is actually broken, NestFactory.create(AppModule) throws and
# every integration test fails immediately, so the safety net doesn't come
# from this metric. seed.ts and load-roster.ts are the opposite case — both
# have real logic and ARE scanned for bugs/vulnerabilities via sonar.sources
# above, but both are only exercised as a subprocess (seed.smoke.int.test.ts
# runs execSync("prisma db seed"); load-roster.test.ts spawnSync's the CLI to
# reach the real process entrypoint guard and a real Nest bootstrap failure —
# neither is reachable by importing the module into the Jest process) so
# ts-jest/Istanbul can never attribute coverage to those lines no matter how
# well they're tested: coverage instrumentation doesn't cross into a child
# process. The logic itself stays covered — RosterLoaderService, where the
# load actually happens, is not in this list.
#
# seed-demo.ts is the same case, for a different reason: it's a plain HTTP
# client (native fetch against a running API), not a Nest provider, so
# there's no service to import into the Jest process either — its only real
# behavior only exists once a live server is on the other end of that fetch,
# which is exactly what seed-demo.test.ts spawns it against (an unreachable
# one, to prove the error path). Everything ABOUT this script that can be
# unit-tested without a live server — the demo roster, the delivery plan, the
# debt/stock math it implies — lives in seed-demo-plan.ts instead, which has
# real tests and is deliberately NOT in this list.
sonar.coverage.exclusions=\
  apps/api/src/**/*.module.ts,\
  apps/api/src/modules/auth/guards/jwt-access.guard.ts,\
  apps/api/src/modules/auth/guards/jwt-refresh.guard.ts,\
  apps/api/src/common/decorators/roles.decorator.ts,\
  apps/api/prisma/seed.ts,\
  apps/api/src/cli/load-roster.ts,\
  apps/api/src/cli/seed-demo.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/vite-env.d.ts

sonar.javascript.lcov.reportPaths=apps/api/coverage/unit/lcov.info,apps/api/coverage/integration/lcov.info,apps/web/coverage/lcov.info
# apps/web usa Vitest + coverage v8; el reporte lcov sale de apps/web/coverage.

sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

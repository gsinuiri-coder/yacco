sonar.organization=gsinuiri-coder
sonar.projectKey=gsinuiri-coder_yacco
sonar.projectName=yacco

sonar.sources=apps/api/src,apps/web/src,packages/shared/src,apps/api/prisma/seed.ts
sonar.tests=apps/api/test
sonar.test.inclusions=**/*.test.ts,**/*.int.test.ts
# dist/** and prisma/migrations/** are preventive: neither currently sits
# under sonar.sources (dist/ is never nested inside a src/ root; migrations
# live in apps/api/prisma, and the only path added from that directory is
# seed.ts, listed explicitly above) so today these two exclude nothing. They
# stay so that dist output or migration SQL added to sonar.sources later is
# excluded from the first commit, not after someone notices it wasn't.
sonar.exclusions=**/dist/**,**/node_modules/**,apps/api/prisma/migrations/**,**/*.test.ts,**/*.test.tsx,apps/web/src/test/**

# Pure declarative Nest wiring (no branches, no functions of their own): if
# any of these is actually broken, NestFactory.create(AppModule) throws and
# every integration test fails immediately, so the safety net doesn't come
# from this metric. seed.ts is the opposite case — it has real upsert logic
# (see apps/api/prisma/seed.ts) and IS scanned for bugs/vulnerabilities via
# sonar.sources above, but its only exerciser is seed.smoke.int.test.ts,
# which runs the CLI as a subprocess (execSync("prisma db seed")) rather than
# through Jest, so ts-jest/Istanbul can never attribute coverage to it no
# matter how well it's tested.
sonar.coverage.exclusions=\
  apps/api/src/**/*.module.ts,\
  apps/api/src/modules/auth/guards/jwt-access.guard.ts,\
  apps/api/src/modules/auth/guards/jwt-refresh.guard.ts,\
  apps/api/src/common/decorators/roles.decorator.ts,\
  apps/api/prisma/seed.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/vite-env.d.ts

sonar.javascript.lcov.reportPaths=apps/api/coverage/unit/lcov.info,apps/api/coverage/integration/lcov.info,apps/web/coverage/lcov.info
# apps/web usa Vitest + coverage v8; el reporte lcov sale de apps/web/coverage.

sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/maxScale: "12"
    run.googleapis.com/urls: '["https://yacco-api-demo-297699663114.us-east4.run.app","https://yacco-api-demo-rngajdr5pa-uk.a.run.app"]'
  labels:
    cloud.googleapis.com/location: us-east4
    run.googleapis.com/satisfiesPzs: "true"
  name: yacco-api-demo
  namespace: "297699663114"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 568.0.0
        run.googleapis.com/startup-cpu-boost: "true"
      labels:
        client.knative.dev/nonce: gkioqxnich
        run.googleapis.com/startupProbeType: Default
    spec:
      containerConcurrency: 80
      containers:
        - env:
            - name: JWT_ACCESS_EXPIRES_IN
              value: 15m
            - name: JWT_REFRESH_EXPIRES_IN
              value: 30d
            - name: WEB_ORIGIN
              value: http://localhost:5173
            - name: DEPLOYED_COMMIT
              value: 52dc5baf6f176b1e75d2de274c37eb0d4f3456cc
            - name: APP_ENV
              value: demo
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: yacco-demo-database-url
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: yacco-demo-direct-url
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: yacco-demo-jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: yacco-demo-jwt-refresh-secret
          image: us-east4-docker.pkg.dev/yacco-v2-prod/yacco/api:52dc5baf6f17
          ports:
            - containerPort: 8080
              name: http1
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            failureThreshold: 1
            periodSeconds: 240
            tcpSocket:
              port: 8080
            timeoutSeconds: 240
      serviceAccountName: yacco-api-demo-run@yacco-v2-prod.iam.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
    - latestRevision: true
      percent: 100

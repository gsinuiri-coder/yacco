name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main builds: deployment will hang off this workflow (§6.2).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Shadow database used only by the migration drift check below.
      shadow-db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shadow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Dummy URLs so `prisma validate` can resolve env("DATABASE_URL") and
      # env("DIRECT_URL"); integration tests override both with the
      # Testcontainers URL, and the app's own env validation only runs when
      # the app actually boots (not during these CLI-only steps).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
      # Exposed as env because the secrets context is not available in step `if` conditions.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud blame and new-code detection.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 — version comes from packageManager in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yacco/api exec prisma generate

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma validate
        run: pnpm prisma:validate

      - name: Check migrations are in sync with the schema
        working-directory: apps/api
        run: >
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://shadow:shadow@localhost:5432/shadow"
          --exit-code

      - name: Build
        # Before the unit tests on purpose: apps/api's CLI subprocess tests
        # (src/cli/load-roster.test.ts) exercise the COMPILED dist/, not tsx
        # on the TS source — tsx/esbuild never emits emitDecoratorMetadata,
        # so it's the only build that proves Nest's DI actually resolves,
        # and it's what `pnpm load:roster` and production both run.
        run: pnpm build

      - name: Web build output for Vercel (D-023)
        # Runs apps/web-nuxt/vercel.json's buildCommand the way `vercel build`
        # does in deploy «5 · Web a Vercel», then the same Build Output guard
        # deploy-web.mjs runs before publishing. No token needed. On this
        # runner std-env detects github_actions ahead of vercel, so a build
        # that leaves the Nitro preset to detection fails here, before merge,
        # instead of in the deploy (2ed19f1).
        run: node scripts/check-web-build.mjs

      - name: Unit tests
        # `pnpm -r test`: Jest en @yacco/api y Vitest en @yacco/web-nuxt y
        # @yacco/shared. Todos dejan su lcov en disco aquí, antes del scan de
        # SonarCloud, que es quien lo lee vía sonar.javascript.lcov.reportPaths.
        # Después, `test:scripts` corre los tests de scripts/ con node --test.
        run: pnpm test

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: SonarCloud scan
        # Skipped on forked PRs (no secrets) and until SONAR_TOKEN is configured.
        if: ${{ env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the full commit history.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

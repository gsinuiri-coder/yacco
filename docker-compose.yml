services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yacco
      POSTGRES_PASSWORD: yacco
      POSTGRES_DB: yacco_dev
    ports:
      - "5432:5432"
    # Postgres 18+ images store data in a major-version subdirectory
    # (/var/lib/postgresql/18/docker), so the mount goes one level up. Mounting
    # at /var/lib/postgresql/data — the pre-18 convention — makes the container
    # refuse to start.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yacco -d yacco_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yacco
      MINIO_ROOT_PASSWORD: yacco12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:

services:
  - type: web
    name: yacco-api
    runtime: node
    plan: free
    region: virginia
    # Repo root is the build cwd (no rootDir): pnpm workspace filters below
    # need to resolve against the monorepo root, not apps/api.
    buildCommand: >-
      HUSKY=0 pnpm install --frozen-lockfile &&
      pnpm --filter @yacco/api exec prisma generate &&
      pnpm --filter @yacco/api build &&
      pnpm db:deploy
    # No migrations here on purpose — migrate deploy already ran at the end
    # of the build, against DIRECT_URL. This only starts the compiled bundle.
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        sync: false
      - key: WEB_ORIGIN
        sync: false

services:
  - type: web
    name: yacco-api
    runtime: node
    plan: free
    region: virginia
    # Repo root is the build cwd (no rootDir): pnpm workspace filters below
    # need to resolve against the monorepo root, not apps/api.
    buildCommand: >-
      HUSKY=0 pnpm install --frozen-lockfile &&
      pnpm --filter @yacco/api exec prisma generate &&
      pnpm --filter @yacco/api build &&
      pnpm db:deploy
    # No migrations here on purpose — migrate deploy already ran at the end
    # of the build, against DIRECT_URL. This only starts the compiled bundle.
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        sync: false
      - key: WEB_ORIGIN
        sync: false

  - type: web
    runtime: static
    name: yacco-web
    # Igual que la API: el build corre desde la raíz del monorepo para que los
    # filtros de pnpm resuelvan contra el workspace.
    buildCommand: >-
      HUSKY=0 pnpm install --frozen-lockfile &&
      pnpm --filter @yacco/web build
    staticPublishPath: apps/web/dist
    routes:
      # SPA: sin este rewrite, entrar directo a /login (o recargar ahí) devuelve
      # 404, porque no existe ese archivo en disco — la ruta la resuelve el
      # router en el cliente.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Vite inlinea las VITE_* en build, así que este valor queda horneado en
      # el bundle: no es un secreto y por eso va en claro, a diferencia de las
      # credenciales de la API.
      - key: VITE_API_BASE_URL
        value: https://yacco-api.onrender.com/api/v1
